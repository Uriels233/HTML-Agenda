<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles/agenda.css">
    <title>Agenda</title>
</head>
<body>

    <main class="app">

        <section id="tela-meses" class="tela">
            <header>
                <h1>Agenda - 2026</h1>
                <p>Escolha o mês</p>
            </header>

            <section id="lista-meses"></section>
        </section>

        <section id="tela-dias" class="tela escondido">
            <header>
                <button id="voltar-meses">Voltar</button>
                <h2 id="titulo-mes"></h2>
            </header>

            <section id="lista-dias"></section>
        </section>

        <section id="tela-dia" class="tela escondido">
            <header>
                <button id="voltar-dias">Voltar</button>
                <h2 id="titulo-dia"></h2>
            </header>

            <section id="horarios"></section>

            <footer>
                <button id="abrir-formulario">Adicionar tarefa</button>
            </footer>
        </section>

        <section id="tela-formulario" class="tela escondido">
            <header>
                <button id="voltar-dia">Voltar</button>
                <h2>Nova tarefa</h2>
            </header>

            <form id="formulario">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" required>

                <label for="local">Local</label>
                <input type="text" id="local">

                <label for="inicio">Início</label>
                <input type="time" id="inicio" required>

                <label for="fim">Fim</label>
                <input type="time" id="fim" required>

                <label for="obs">Observações</label>
                <textarea id="obs"></textarea>

                <button type="submit">Salvar</button>
            </form>
        </section>

    </main>
        
    <script type="module" src="/src/main.js"></script>
    
</body>
</html>
