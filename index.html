<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles/agenda.css">
    <title>Agenda</title>
</head>
<body>

    <main class="agenda">
        <header>
            <h1>Agenda - 2026</h1>
        </header>

        <table class="agenda-table">
            <thead>
                <tr><th>Mês</th></tr>
            </thead>
            <tbody>
                <tr><td class="mes" data-mes="0">Janeiro</td></tr>
                <tr><td class="mes" data-mes="1">Fevereiro</td></tr>
                <tr><td class="mes" data-mes="2">Março</td></tr>
                <tr><td class="mes" data-mes="3">Abril</td></tr>
                <tr><td class="mes" data-mes="4">Maio</td></tr>
                <tr><td class="mes" data-mes="5">Junho</td></tr>
            </tbody>
        </table>
    </main>    
        
    <script type="module" src="/src/main.js"></script>
    
</body>
</html>
