<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles/agenda.css">
    <title>Agenda</title>
</head>
<body>

    <main class="agenda">
        <header>
            <div class="div-title">
                <h1>Agenda - 2026</h1>
            </div>
            <div class="div-title-mes">
                <h2>Mês</h2>
            </div>
        </header>

        <ul class="lista-meses">
            <li class="item-mes">
                <button class="mes" data-mes="0">Janeiro</button>
                <table class="calendario"></table>
            </li>

            <li class="item-mes">
                <button class="mes" data-mes="1">Fevereiro</button>
                <table class="calendario"></table>
            </li>

            <li class="item-mes">
                <button class="mes" data-mes="2">Março</button>
                <table class="calendario"></table>
            </li>

            <li class="item-mes">
                <button class="mes" data-mes="3">Abril</button>
                <table class="calendario"></table>
            </li>

            <li class="item-mes">
                <button class="mes" data-mes="4">Maio</button>
                <table class="calendario"></table>
            </li>

            <li class="item-mes">
                <button class="mes" data-mes="5">Junho</button>
                <table class="calendario"></table>
            </li>
        </ul>

    </main>    
        
    <script type="module" src="/src/main.js"></script>
    
</body>
</html>
